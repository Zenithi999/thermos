<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOMAD — Premium Insulated Thermos</title>
  <link rel="icon" href="data:," />

  <!-- Fonts: serif display for headline/logo, Inter for small text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Full-screen rounded frame -->
  <main class="frame" id="frame">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <div class="logo">NOMAD</div>

      <nav class="pill-nav" aria-label="Primary navigation">
        <button class="nav-btn active" aria-label="Home" data-icon="grid">
          <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
        </button>
        <button class="nav-btn" aria-label="Instagram" data-icon="instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.2" cy="6.8" r="1.1"/></svg>
        </button>
        <button class="nav-btn" aria-label="Threads" data-icon="threads">
          <svg viewBox="0 0 24 24"><path d="M12 2C7 2 5 5.5 5 9.5c0 3 1.4 4.6 3.2 5.6-1 .3-2.2 1-2.2 2.9 0 2.6 2.5 4 5.8 4 4.9 0 7.2-3.1 7.2-7.9 0-3.2-1-5.3-2.6-6.6.2-1.4-.2-3.5-2-4.6C13.7 2.2 12.9 2 12 2z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="nav-btn" aria-label="X (Twitter)" data-icon="x">
          <svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="nav-btn" aria-label="Cart" data-icon="cart">
          <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        </button>
      </nav>

      <button class="locate-btn" aria-label="Store locator">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </header>

    <!-- ===== HERO STAGE (carousel) ===== -->
    <section class="stage" id="stage" aria-label="Product carousel">

      <!-- Side cards + hero product are all injected/positioned by JS,
           but we keep static slots in the DOM for clean structure. -->
      <!-- Product cards are created by script.js: one permanent
           DOM element per product that only ever changes slot
           position (left/rotate/scale), never its image. -->
      <div class="carousel" id="carousel"></div>

      <!-- Price card -->
      <div class="price-card" id="priceCard">
        <div class="price-info">
          <span class="price-name" id="priceName">Matte Black</span>
          <span class="price-value" id="priceValue">$38</span>
        </div>
        <button class="price-cart" aria-label="Add to cart">
          <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        </button>
      </div>

      <!-- Carousel nav arrows -->
      <button class="arrow arrow-left" id="arrowLeft" aria-label="Previous product">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="arrow arrow-right" id="arrowRight" aria-label="Next product">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <!-- ===== HEADLINE ===== -->
    <h1 class="headline">Choose your&nbsp;thermos</h1>

    <!-- Dot indicators -->
    <div class="dots" id="dots"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
